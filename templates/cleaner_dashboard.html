<!DOCTYPE html>
<html>
<head>
    <title>Cleaner Dashboard - Waste Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <div class="header">
        <h2>Cleaner Dashboard</h2>
        <p>View and Clear Pending Waste Records</p>
    </div>

    <div class="content">

        <a href="{{ url_for('logout') }}" class="button">Logout</a>

        <table>
            <tr>
                <th>ID</th>
                <th>Area</th>
                <th>Waste Type</th>
                <th>Quantity (kg)</th>
                <th>Date</th>
                <th>Status</th>
                <th>Action</th>
            </tr>

            {% for waste in wastes %}
            <tr>
                <!-- FIX: Added ID column -->
                <td>{{ waste.record_id }}</td>
                <td>{{ waste.area }}</td>
                <td>{{ waste.waste_type }}</td>
                <td>{{ waste.quantity }}</td>
                <td>{{ waste.date }}</td>

                <td>
                    <span class="status-pending">Pending</span>
                </td>

                <td>
                    <a href="{{ url_for('mark_cleared', id=waste.record_id) }}"
                       class="button small"
                       onclick="return confirm('Mark this waste as cleared?')">
                       Mark as Cleared
                    </a>
                </td>
            </tr>
            {% endfor %}

        </table>

    </div>

</div>

</body>
</html>
