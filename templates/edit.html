<!DOCTYPE html>
<html>
<head>
    <title>Edit Waste</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h2>Edit Waste Record</h2>

    <form method="post">
        <label>Area</label>
        <input type="text" name="area" value="{{ waste.area }}" required>

        <label>Waste Type</label>
        <input type="text" name="waste_type" value="{{ waste.waste_type }}" required>

        <label>Quantity (kg)</label>
        <input type="number" name="quantity" value="{{ waste.quantity }}" required>

        <label>Date</label>
        <input type="date" name="date" value="{{ waste.date }}" required>

        <button type="submit">Update Waste</button>
    </form>

    <br>
    <a href="/" class="button">⬅ Back to Home</a>

</div>

</body>
</html>
