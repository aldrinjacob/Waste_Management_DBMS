<!DOCTYPE html>
<html>
<head>
    <title>Edit Waste</title>
</head>
<body>

<h2>Edit Waste Details</h2>

<form method="post">
    <label>Area:</label><br>
    <input type="text" name="area" value="{{ waste.area }}" required><br><br>

    <label>Waste Type:</label><br>
    <select name="waste_type" required>
        <option value="Wet" {% if waste.waste_type == 'Wet' %}selected{% endif %}>Wet</option>
        <option value="Dry" {% if waste.waste_type == 'Dry' %}selected{% endif %}>Dry</option>
    </select><br><br>

    <label>Quantity (kg):</label><br>
    <input type="number" name="quantity" value="{{ waste.quantity }}" required><br><br>

    <label>Date:</label><br>
    <input type="date" name="date" value="{{ waste.date }}" required><br><br>

    <button type="submit">Update Waste</button>
</form>

<br>
<a href="{{ url_for('index') }}">⬅ Back to Home</a>

</body>
</html>
