<!DOCTYPE html>
<html>
<head>
    <title>Edit Waste</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h2>Edit Waste Record</h2>

    <form method="post">

        <label>Area</label>
        <select name="area_id" required>
            {% for area in areas %}
            <option value="{{ area['area_id'] }}"
                {% if area['area_id'] == waste['area_id'] %}selected{% endif %}>
                {{ area['area_name'] }}
            </option>
            {% endfor %}
        </select>

        <label>Waste Type</label>
        <select name="type_id" required>
            {% for wt in waste_types %}
            <option value="{{ wt['type_id'] }}"
                {% if wt['type_id'] == waste['type_id'] %}selected{% endif %}>
                {{ wt['type_name'] }}
            </option>
            {% endfor %}
        </select>

        <label>Quantity (kg)</label>
        <input type="number" name="quantity" value="{{ waste['quantity'] }}" required>

        <label>Date</label>
        <input type="date" name="date" value="{{ waste['record_date'] }}" required>

        <button type="submit">Update Waste</button>
    </form>

    <br>
    <a href="{{ url_for('dashboard') }}">⬅ Back to Dashboard</a>
</div>

</body>
</html>
