<!DOCTYPE html>
<html>
<head>
    <title>Waste Management System</title>
</head>
<body>

<h2>Waste Management System</h2>
<a href="/logout">Logout</a>
<br><br>

<a href="{{ url_for('add') }}">➕ Add Waste</a>

<br><br>

<table border="1" cellpadding="8">
    <tr>
        <th>ID</th>
        <th>Area</th>
        <th>Waste Type</th>
        <th>Quantity (kg)</th>
        <th>Date</th>
        <th>Action</th>
    </tr>

    {% for waste in wastes %}
    <tr>
        <td>{{ waste.id }}</td>
        <td>{{ waste.area }}</td>
        <td>{{ waste.waste_type }}</td>
        <td>{{ waste.quantity }}</td>
        <td>{{ waste.date }}</td>
        <td>
            <a href="{{ url_for('edit', id=waste.id) }}">Edit</a> |
            <a href="{{ url_for('delete', id=waste.id) }}"
               onclick="return confirm('Are you sure?')">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
